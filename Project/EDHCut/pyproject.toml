[project]
name = "edhcut"
version = "0.1.0"
description = "Data-driven tool that suggests which card to cut from a Commander (EDH) deck"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "mtg-parser>=0.0.1a55",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
]

[project.optional-dependencies]
# notebooks/ (task 5.6, course EDA deliverable) — not needed to run the ingest pipeline or
# tests, only to author/execute the notebooks themselves.
notebooks = [
    "plotly>=5.20",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "matplotlib>=3.8",
    "ipywidgets>=8.0",
    "anywidget>=0.9",  # plotly>=6's go.FigureWidget requires this (interactive hover widgets)
]
# edhcut/analysis/embeddings.py's train_word2vec/word2vec_frame (task 6.2) only. Deliberately
# NOT a core dependency: gensim's shipped C source uses CPython internals (PyLongObject layout,
# _PyLong_AsByteArray's old signature) that Python 3.14 changed, so it has no wheel and cannot
# even build from source on the repo's shared Python 3.14 venv (confirmed live -- fails the same
# way with a working MSVC compiler). scikit-learn has no such issue (it's a core dependency,
# used by embeddings.py's TF-IDF/SVD step and by notebooks doing their own dimensionality
# reduction, both fine on 3.14) -- only gensim needs the separate `venv311/` (Python 3.11) venv
# at repo root. See CONTEXT.md/project memory for why a second venv was reintroduced despite the
# earlier decision to avoid one.
embeddings = [
    "gensim>=4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edhcut"]
