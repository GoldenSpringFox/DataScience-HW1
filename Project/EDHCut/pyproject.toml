[project]
name = "edhcut"
version = "0.1.0"
description = "Data-driven tool that suggests which card to cut from a Commander (EDH) deck"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "requests-cache>=1.2",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "mtg-parser>=0.0.1a55",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edhcut"]
